<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인생역전</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--sub:#5d6b78;--line:#d5dce3;--up:#e5383b;--down:#2563eb;--acc:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#1a242d;--ink:#e8eef3;--sub:#9aa9b6;--line:#2c3a46;--up:#ff6b6e;--down:#6ea0ff;--acc:#2dd4bf}}
:root[data-theme="dark"]{--bg:#10171e;--card:#1a242d;--ink:#e8eef3;--sub:#9aa9b6;--line:#2c3a46;--up:#ff6b6e;--down:#6ea0ff;--acc:#2dd4bf}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:2rem;margin:4px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat small{color:var(--sub);display:block;font-size:.78rem}
.stat b{font-size:1.05rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.tab.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:700}
.stock{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.price{font-size:1.8rem;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
button.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 6px;cursor:pointer;color:#fff;min-height:44px}
.buy{background:var(--up)}.sell{background:var(--down)}
.next{grid-column:1/-1;background:var(--acc)}
.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)!important}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#news{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px;margin:10px 0}
#news p{margin:6px 0}
#toast{min-height:1.6em;color:var(--sub);font-size:.9rem;margin:6px 0}
.ov{position:fixed;inset:0;background:rgba(10,18,26,.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.ov[hidden]{display:none}
.box{background:var(--card);border-radius:16px;padding:24px;max-width:380px;text-align:center}
#cv{width:100%;height:260px;display:block;margin:8px 0}
#flash{background:var(--up);color:#fff;border-radius:12px;padding:12px;margin:10px 0;font-weight:700;animation:pulse 1s ease-in-out 3}
#flash[hidden]{display:none}
@keyframes pulse{50%{transform:scale(1.02)}}
@media(prefers-reduced-motion:reduce){#flash{animation:none}}
.hint{color:var(--sub);font-size:.82rem}
</style>
</head>
<body>
<main>
<h1>📈 인생역전</h1>
<p class="hint">시사는 참고용이라 가끔 빗나가요. 월세를 낼 현금이 없으면 끝나니, 현금을 꼭 남겨두세요! 🚨 긴급속보는 예고 없이 터져요.</p>
<div class="stats">
<div class="stat"><small>📅 날짜</small><b id="day"></b></div>
<div class="stat"><small>🏦 총 자산(점수)</small><b id="tot"></b></div>
<div class="stat"><small>💰 보유 현금</small><b id="cash"></b></div>
<div class="stat"><small>🏠 월세까지</small><b id="rent"></b></div>
</div>
<div class="hint">🎯 목표: 총 자산 1,000만원 · 수수료 0.2%</div>
<div id="flash" hidden role="alert"></div>
<div id="news"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="stock" id="stock"></div>
<div class="btns">
<button class="b buy" data-a="b1">매수 1주 (B)</button>
<button class="b sell" data-a="s1">매도 1주 (S)</button>
<button class="b buy" data-a="b10">매수 10주</button>
<button class="b sell" data-a="s10">매도 10주</button>
<button class="b buy" data-a="bmax">최대 매수</button>
<button class="b sell" data-a="sall">전량 매도</button>
<button class="b next" data-a="next">다음 날로 ▶ (N)</button>
</div>
<div id="toast" aria-live="polite"></div>
<p class="hint">PC: ←→ 종목, B 매수, S 매도, N 다음날 · 폰: 버튼 터치</p>
</main>

<div class="ov" id="start"><div class="box"><h1>📈 인생역전</h1><p>시작 자금 200만원으로 1,000만원을 만들어 보세요.<br>월세는 8일마다 25만원, 현금으로만 낼 수 있어요.</p><button class="b next" id="go" style="width:100%">게임 시작</button></div></div>
<div class="ov" id="end" hidden><div class="box"><h1 id="et"></h1><p id="em"></p><button class="b next" id="again" style="width:100%">다시 하기</button></div></div>

<script>
const $=id=>document.getElementById(id);
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const FEE=0.002,RENT=250000,EVERY=8,GOAL=10000000,START=2000000,ACC=0.7;
const BASE=[{n:'한빛반도체',e:'💾',p:50000},{n:'푸른바이오',e:'🧬',p:30000},{n:'달빛엔터',e:'🎬',p:20000},{n:'든든은행',e:'🏦',p:40000}];
const UP=['신제품 대박 예고','실적 호조 발표','대형 계약 체결'],DN=['실적 부진 발표','대표 구설수 논란','주요 계약 취소'];
const surge=()=>.2+Math.pow(Math.random(),2)*1.3; // +20%~+150%
const r10=v=>Math.max(1000,Math.round(v/10)*10);
const BRK=[
 {t:'회계 부정 의혹이 터졌습니다!',d:-1},{t:'해외 대형 인수 소식이 전해졌습니다!',d:1},
 {t:'핵심 임원 대량 이탈 소식!',d:-1},{t:'정부 지원 사업 선정!',d:1},
 {t:'🌍 글로벌 쇼크! 증시 전체가 폭락합니다!',d:-1,all:1},{t:'🌍 금리 인하 발표! 증시 전체가 급등합니다!',d:1,all:1}];
let g;
function candle(o,ch){
  const c=r10(o*(1+ch)),w=Math.abs(ch)+.01;
  return{o,c,h:r10(Math.max(o,c)*(1+Math.random()*w*.6)),l:r10(Math.min(o,c)*(1-Math.random()*w*.6)),v:Math.round(1000+Math.random()*3000+Math.abs(ch)*60000)};
}
function seed(p){const a=[];for(let i=0;i<40;i++){const k=candle(p,(Math.random()-.5)*.05);a.push(k);p=k.c}return a}
function init(){
  g={day:1,cash:START,sel:0,due:EVERY,over:false,
    s:BASE.map(x=>({...x,h:seed(x.p),hold:0,cost:0})),news:[]};
  makeNews();render();$('toast').textContent='';
}
const px=s=>s.h.at(-1).c;
function makeNews(){
  const ids=[0,1,2,3].sort(()=>Math.random()-.5).slice(0,2);
  g.news=ids.map(i=>{const d=Math.random()<.5?1:-1;
    const t=(d>0?UP:DN)[Math.floor(Math.random()*3)];
    return{i,d,text:`${g.s[i].e} ${g.s[i].n}: ${t}`}});
}
const total=()=>g.cash+g.s.reduce((a,s)=>a+s.hold*px(s),0);
function render(){
  $('day').textContent=g.day+'일차';
  $('cash').textContent=won(g.cash);
  $('tot').textContent=won(total());
  $('rent').textContent=(g.due-g.day)+'일 후 ('+won(RENT)+')';
  $('flash').hidden=!g.flash;$('flash').textContent=g.flash||'';
  $('news').innerHTML='<b>📰 오늘의 시사</b>'+g.news.map(n=>`<p>${n.text} → 내일 <b class="${n.d>0?'up':'down'}">${n.d>0?'▲ 상승':'▼ 하락'}</b> 예상 <span class="hint">(틀릴 수도 있어요)</span></p>`).join('');
  $('tabs').innerHTML=g.s.map((s,i)=>`<button class="tab ${i==g.sel?'on':''}" data-t="${i}" role="tab">${s.e} ${s.n}</button>`).join('');
  const s=g.s[g.sel],k=s.h.at(-1),pv=s.h.at(-2).c,c=(k.c-pv)/pv*100;
  const pl=s.hold?s.hold*k.c-s.cost:0,pr=s.cost?pl/s.cost*100:0;
  $('stock').innerHTML=`<div class="row"><div><div class="price ${c>=0?'up':'down'}">${won(k.c)}</div><span class="${c>=0?'up':'down'}">${c>=0?'▲':'▼'} ${Math.abs(c).toFixed(2)}%</span></div>
  <div class="hint" style="text-align:right">시 ${k.o.toLocaleString()} · 고 ${k.h.toLocaleString()}<br>저 ${k.l.toLocaleString()} · 거래량 ${k.v.toLocaleString()}</div></div>
  <canvas id="cv" aria-label="캔들 차트"></canvas>
  <p class="hint">보유 ${s.hold}주 · 평가금액 ${won(s.hold*k.c)}${s.hold?` · 손익 <b class="${pl>=0?'up':'down'}">${pl>=0?'+':''}${won(pl)} (${pr.toFixed(1)}%)</b>`:''}</p>`;
  draw();
}
function draw(){
  const cv=$('cv');if(!cv)return;
  const s=g.s[g.sel],n=40,all=s.h,data=all.slice(-n),off=all.length-n;
  const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  cv.width=r.width*d;cv.height=r.height*d;
  const x=cv.getContext('2d');x.scale(d,d);
  const W=r.width,H=r.height,cs=getComputedStyle(document.documentElement);
  const C=v=>cs.getPropertyValue(v).trim();
  const L=4,R=W-58,T=10,PH=H*.7,VT=H*.78,VH=H*.2;
  let mx=Math.max(...data.map(k=>k.h)),mn=Math.min(...data.map(k=>k.l));
  const pad=(mx-mn)*.08;mx+=pad;mn-=pad;
  const y=v=>T+(mx-v)/(mx-mn)*PH,cw=(R-L)/n;
  x.font='11px "Noto Sans KR",sans-serif';x.lineWidth=1;
  for(let i=0;i<=4;i++){
    const v=mx-(mx-mn)*i/4,yy=y(v);
    x.strokeStyle=C('--line');x.beginPath();x.moveTo(L,yy);x.lineTo(R,yy);x.stroke();
    x.fillStyle=C('--sub');x.textAlign='left';x.fillText(Math.round(v).toLocaleString(),R+4,yy+4);
  }
  const vm=Math.max(...data.map(k=>k.v));
  data.forEach((k,i)=>{
    const cx=L+cw*i+cw/2,up=k.c>=k.o,col=C(up?'--up':'--down');
    x.strokeStyle=col;x.fillStyle=col;
    x.beginPath();x.moveTo(cx,y(k.h));x.lineTo(cx,y(k.l));x.stroke();
    const bt=y(Math.max(k.o,k.c)),bh=Math.max(1.5,Math.abs(y(k.o)-y(k.c)));
    x.fillRect(cx-cw*.35,bt,cw*.7,bh);
    x.globalAlpha=.45;const vh=k.v/vm*VH;x.fillRect(cx-cw*.35,VT+VH-vh,cw*.7,vh);x.globalAlpha=1;
  });
  const ma=(m,col)=>{x.strokeStyle=col;x.lineWidth=1.5;x.beginPath();let st=false;
    data.forEach((_,i)=>{const gi=off+i;if(gi<m-1)return;
      let t=0;for(let j=gi-m+1;j<=gi;j++)t+=all[j].c;
      const px_=L+cw*i+cw/2,py=y(t/m);st?x.lineTo(px_,py):x.moveTo(px_,py);st=true});x.stroke();x.lineWidth=1};
  ma(5,'#f5a524');ma(20,'#a855f7');
  x.fillStyle='#f5a524';x.textAlign='left';x.fillText('MA5',L+4,T+10);
  x.fillStyle='#a855f7';x.fillText('MA20',L+38,T+10);
  const last=data.at(-1),ly=y(last.c),lc=C(last.c>=last.o?'--up':'--down');
  x.setLineDash([4,3]);x.strokeStyle=lc;x.beginPath();x.moveTo(L,ly);x.lineTo(R,ly);x.stroke();x.setLineDash([]);
  x.fillStyle=lc;x.fillRect(R+1,ly-9,W-R-1,18);
  x.fillStyle='#fff';x.fillText(last.c.toLocaleString(),R+4,ly+4);
}
function say(m){$('toast').textContent=m}
function buy(n){const s=g.s[g.sel],p=px(s),max=Math.floor(g.cash/(p*(1+FEE)));
  n=n==='max'?max:n;if(n<1||n>max)return say('현금이 부족해요.');
  const c=p*n*(1+FEE);g.cash-=c;s.cost+=c;s.hold+=n;say(`${s.n} ${n}주 매수`);render()}
function sell(n){const s=g.s[g.sel],p=px(s);n=n==='all'?s.hold:n;
  if(n<1||n>s.hold)return say('보유 주식이 부족해요.');
  g.cash+=p*n*(1-FEE);s.cost-=s.cost*n/s.hold;s.hold-=n;if(!s.hold)s.cost=0;say(`${s.n} ${n}주 매도`);render()}
function nextDay(){
  g.flash=null;let ev=null;
  if(Math.random()<.25){ev={...BRK[Math.floor(Math.random()*BRK.length)],i:Math.floor(Math.random()*4)};
    g.flash=`🚨 긴급속보 — ${ev.all?'':g.s[ev.i].e+' '+g.s[ev.i].n+': '}${ev.t}`}
  g.s.forEach((s,i)=>{
    let ch=(Math.random()-.5)*.05;
    const nw=g.news.find(n=>n.i===i);
    if(nw){const dir=Math.random()<ACC?nw.d:-nw.d;ch+=dir>0?(Math.random()<.2?surge():.06+Math.random()*.1):-(.06+Math.random()*.08)}
    if(ev&&(ev.all||ev.i===i))ch+=ev.d>0?(ev.all?.06+Math.random()*.1:surge()):-(ev.all?.04+Math.random()*.05:.1+Math.random()*.1);
    s.h.push(candle(px(s),ch));
  });
  g.day++;makeNews();say('');
  if(g.day>=g.due){
    if(g.cash<RENT)return finish(false);
    g.cash-=RENT;g.due+=EVERY;say(`🏠 월세 ${won(RENT)}를 냈어요.`);
  }
  render();
  if(total()>=GOAL)finish(true);
}
function finish(win){
  g.over=true;render();
  $('et').textContent=win?'🎉 인생역전 성공!':'💸 게임 오버';
  $('em').textContent=(win?'목표 달성! ':'월세를 낼 현금이 없어요. ')+`${g.day}일차 · 점수 ${won(total())}`;
  $('end').hidden=false;
}
function act(a){if(g.over)return;
  ({b1:()=>buy(1),s1:()=>sell(1),b10:()=>buy(10),s10:()=>sell(10),bmax:()=>buy('max'),sall:()=>sell('all'),next:nextDay})[a]()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(b)act(b.dataset.a);
  const t=e.target.closest('[data-t]');if(t){g.sel=+t.dataset.t;render()}
});
document.addEventListener('keydown',e=>{
  if(g?.over||!$('start').hidden)return;
  const k=e.key.toLowerCase();
  if(k==='arrowright'){g.sel=(g.sel+1)%4;render()}
  else if(k==='arrowleft'){g.sel=(g.sel+3)%4;render()}
  else if(k==='b')act('b1');else if(k==='s')act('s1');else if(k==='n')act('next');
});
window.addEventListener('resize',draw);
$('go').onclick=()=>{$('start').hidden=true};
$('again').onclick=()=>{$('end').hidden=true;init()};
init();
</script>
</body>
</html>
